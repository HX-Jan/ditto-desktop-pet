name: Build Windows preview
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Check behavior and package standalone Windows app
        shell: pwsh
        run: ./tools/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DittoDesktopPet-win-x64
          path: |
            artifacts/DittoDesktopPet-v0.1.0-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DittoDesktopPet-win-x64
          path: dist
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "百变怪桌宠 $GITHUB_REF_NAME · 试运行版" --notes-file docs/RELEASE.md
